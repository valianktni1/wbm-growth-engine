<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Weddings By Mark Growth Engine</title>
  <style>[hidden]{display:none!important}</style>
  <link rel="stylesheet" href="/static/app.css?v=1.5.1">
  <link rel="stylesheet" href="/static/account.css?v=1.5.1">
  <link rel="stylesheet" href="/static/growth.css?v=1.1.1">
  <script src="/static/growth.js?v=1.5.1" defer></script>
  <script src="/static/account.js?v=1.5.1" defer></script>
  <script src="/static/intelligence.js?v=1.2.0" defer></script>
  <link rel="stylesheet" href="/static/intelligence.css?v=1.2.0">
  <link rel="stylesheet" href="/static/gaps.css?v=1.3.0">
  <script src="/static/gaps.js?v=1.4.0" defer></script>
  <script src="/static/planning.js?v=1.4.0" defer></script>

  <link rel="stylesheet" href="/static/planning.css?v=1.4.0">

<body>
  <div id="app" hidden>
    <header class="topbar">
      <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open menu">☰</button>
      <a class="brand" href="#dashboard"><span>Weddings By Mark</span><strong>Growth Engine</strong></a>
      <nav id="navigation" aria-label="Main navigation">
        <button data-view="today" type="button">Today</button>
        <button data-view="website" type="button">Website performance</button>
        <button data-view="planning" type="button">Business plan</button>
        <button data-view="gaps" type="button">Fill my dates</button>
        <button data-view="performance" type="button">What works</button>
        <button data-view="enquiries" type="button">Enquiries</button>
        <button data-view="admin" type="button">Admin</button>
      </nav>
      <button class="profile" id="profile" type="button" aria-label="Open admin settings"><span id="admin-name">Mark</span><i>MP</i></button>
    </header>
    <main id="workspace" tabindex="-1"></main>
  </div>
  <div id="loading" class="loading-screen"><div class="spinner"></div><p>Opening your Growth Engine…</p></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
