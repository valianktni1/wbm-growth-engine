<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · Growth Engine</title>
  <link rel="stylesheet" href="/static/app.css?v=1.0.0">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <header><span>Weddings By Mark</span><h1>Growth Engine</h1><p>See which couples are interested and what needs your attention.</p></header>
      <form id="login-form">
        <label>Email address<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary wide" type="submit">Sign in securely</button>
      </form>
    </section>
  </main>
  <script src="/static/login.js?v=1.0.0"></script>
</body>
</html>
